[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ceai-memory-middleware"
version = "0.1.0"
description = "Adaptive memory middleware: per-turn switching between sliding window, hierarchical summarization and RAG."
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.6",
  "numpy>=1.26",
  "faiss-cpu>=1.8",
  "sentence-transformers>=3.0",
  "tiktoken>=0.7",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
dev = ["pytest>=8"]
tui = ["rich>=13", "prompt_toolkit>=3.0"]

[tool.setuptools.packages.find]
where = ["packages"]

[tool.setuptools.package-data]
dashboard = ["static/*"]

[tool.pytest.ini_options]
pythonpath = ["packages", "."]
testpaths = ["tests"]
markers = ["models: tests that load the real embedding / NLI models (slow)"]
